services:
  # --- VERİTABANI ---
  db:
    image: postgres:15-alpine
    container_name: nexus_db
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus_network

  # --- WEB UYGULAMASI (ÖLÇEKLENDİRME İÇİN HAZIRLANDI) ---
  web:
    build: .
    # container_name: nexus_web <--- BU SATIR KALDIRILDI!
    restart: always
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://nexus_user:secure_password_123@db:5432/inventory_db
      - SECRET_KEY=gizli_anahtar_999_super_gizli
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus_network

  # --- YÜK DENGELEYİCİ ---
  nginx:
    image: nginx:alpine
    container_name: nexus_lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - nexus_network

  # --- PERFORMANS İZLEME ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: nexus_monitor
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - nexus_network

volumes:
  postgres_data:
  portainer_data:

networks:
  nexus_network:
    driver: bridge