<style>
    /* --- SIDEBAR ÖZEL TASARIMI (LAYOUT İLE UYUMLU) --- */
    
    .nexus-sidebar {
        /* Layout'taki değişkenleri kullanıyoruz veya sabit renkler veriyoruz */
        width: 280px;
        min-height: 100vh;
        background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        color: #94a3b8; /* Varsayılan metin rengi (Slate-400) */
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1rem;
        border-right: 1px solid rgba(255,255,255,0.05);
        box-shadow: 4px 0 24px rgba(0,0,0,0.2);
        z-index: 1050;
    }

    /* 1. Marka Alanı */
    .sidebar-brand {
        display: flex;
        align-items: center;
        text-decoration: none;
        margin-bottom: 2.5rem;
        padding: 0 0.5rem;
    }

    .brand-box {
        width: 42px; height: 42px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); /* Nexus Mavisi */
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 1.2rem;
        margin-right: 12px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); /* Mavi Glow */
    }

    .brand-title {
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        letter-spacing: -0.5px;
        line-height: 1;
    }

    .brand-subtitle {
        color: #64748b;
        font-size: 0.75rem;
        letter-spacing: 1px;
        font-weight: 600;
        margin-top: 2px;
    }

    /* 2. Menü Linkleri */
    .sidebar-menu {
        list-style: none; padding: 0; margin: 0;
        display: flex; flex-direction: column; gap: 6px;
        flex-grow: 1;
    }

    .menu-link {
        display: flex; align-items: center;
        padding: 12px 16px;
        border-radius: 10px;
        color: #94a3b8; /* Pasif renk */
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.2s ease-in-out;
        border-left: 3px solid transparent; /* Aktiflik çizgisi için yer */
    }

    /* Hover Efekti */
    .menu-link:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: #f1f5f9;
        transform: translateX(4px);
    }

    /* Aktif Link Tasarımı */
    .menu-link.active {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.15) 0%, rgba(37, 99, 235, 0) 100%);
        color: #ffffff;
        border-left-color: #38bdf8; /* Açık Mavi Çizgi */
        font-weight: 600;
    }

    .menu-link i {
        width: 24px; text-align: center; margin-right: 12px;
        font-size: 1.1rem; transition: 0.2s;
    }

    .menu-link.active i {
        color: #38bdf8; /* İkonu parlat */
        filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.5));
    }

    /* 3. Alt Profil Kartı */
    .sidebar-footer {
        margin-top: auto;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    .profile-card {
        display: flex; align-items: center;
        padding: 10px;
        border-radius: 12px;
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.05);
        cursor: pointer;
        transition: 0.2s;
        text-decoration: none;
    }

    .profile-card:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.1);
    }

    .avatar-circle {
        width: 38px; height: 38px;
        background: #334155;
        color: white;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 0.9rem;
        margin-right: 12px;
        border: 2px solid rgba(255,255,255,0.1);
    }
</style>

<div class="nexus-sidebar">
    
    <a href="/" class="sidebar-brand">
        <div class="brand-box">
            <i class="fa-solid fa-cube"></i>
        </div>
        <div class="d-flex flex-column">
            <span class="brand-title">NEXUS</span>
            <span class="brand-subtitle">ENTERPRISE</span>
        </div>
    </a>

    <ul class="sidebar-menu">
        <li>
            <a href="{{ url_for('main.dashboard') }}" 
               class="menu-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Genel Bakış</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('inventory.index') }}" 
               class="menu-link {% if 'inventory' in request.path %}active{% endif %}">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>Envanter</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('settings.index') }}" 
               class="menu-link {% if 'settings' in request.path %}active{% endif %}">
                <i class="fa-solid fa-sliders"></i>
                <span>Ayarlar</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer dropdown">
        <div class="profile-card dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="avatar-circle">
                {{ current_user.username[0]|upper }}
            </div>
            <div class="d-flex flex-column overflow-hidden">
                <span class="text-white fw-bold small text-truncate">{{ current_user.username }}</span>
                <span class="text-muted" style="font-size: 0.7rem; text-transform: uppercase;">{{ current_user.role or 'Kullanıcı' }}</span>
            </div>
        </div>
        
        <ul class="dropdown-menu dropdown-menu-dark shadow-lg border-0 mb-2 w-100 p-2 rounded-3" 
            style="background-color: #1e293b; border: 1px solid #334155;">
            <li>
                <a class="dropdown-item rounded-2 d-flex align-items-center" href="{{ url_for('auth.profile') }}">
                    <i class="fa-regular fa-user me-2 text-primary"></i> Profil
                </a>
            </li>
            <li><hr class="dropdown-divider border-secondary opacity-25"></li>
            <li>
                <a class="dropdown-item rounded-2 text-danger d-flex align-items-center" href="{{ url_for('auth.logout') }}">
                    <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Çıkış Yap
                </a>
            </li>
        </ul>
    </div>

</div>
